# Versioned copy of /etc/nginx/sites-enabled/dex.dobprotocol.com (dob-platform EC2).
# Edit here, then copy to the server (backup first), `nginx -t`, reload.
server {
    listen 443 ssl;
    server_name dex.dobprotocol.com;
    include /etc/nginx/snippets/sec-headers.conf;

    ssl_certificate /etc/letsencrypt/live/dex.dobprotocol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dex.dobprotocol.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/Dobhooks/app;
    index index.html;

    # R1 (verify_sites): the landing is built in en (/), es, pt, zh, hi
    # (scripts/i18n/build_landing.py -> app/<lang>/index.html). `/` redirects to
    # the visitor's language: an explicit choice (cookie dob_lang, set by the nav
    # selector) wins over Accept-Language; English stays at `/` (crawlers send no
    # Accept-Language).
    set $dob_lang "";
    if ($http_accept_language ~* "^\s*(es|pt|zh|hi)") {
        set $dob_lang $1;
    }
    if ($cookie_dob_lang ~ "^(es|pt|zh|hi)$") {
        set $dob_lang $cookie_dob_lang;
    }
    if ($cookie_dob_lang = "en") {
        set $dob_lang "";
    }

    location = / {
        include /etc/nginx/snippets/sec-headers.conf;
        add_header Vary "Accept-Language, Cookie" always;
        if ($dob_lang != "") {
            return 302 /$dob_lang/;
        }
        try_files /index.html =404;
    }

    # P13: deployed commit (sha + date), written by the deploy step.
    location = /REVISION {
        include /etc/nginx/snippets/sec-headers.conf;
        alias /opt/Dobhooks/REVISION;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Written by the exit-monitor cron (PM2 exit-monitor) from the Soroban
    # event log. Served straight off disk: it is a static file rewritten
    # atomically every five minutes, so nginx never reads a partial one and
    # no process has to be up for the dashboard to load.
    location = /exit-layer.json { include /etc/nginx/snippets/sec-headers.conf;
        alias /var/lib/dobdex-exit-monitor/snapshot.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=60";
    }

    location = /landing.html { return 301 /; }

    location / {
        try_files $uri $uri/ =404;  # 2026-10-03 R6: unknown paths 404 instead of index.html
    }
}

server {
    listen 80;
    server_name dex.dobprotocol.com;
    return 301 https://$host$request_uri;
}
